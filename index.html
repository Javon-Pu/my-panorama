<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° 空間環景漫遊</title>
    <!-- 引入 Pannellum 樣式與核心 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #panorama {
            width: 100%;
            height: 100%;
        }
        /* 左上角標題卡片 */
        .title-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .title-bar h2 {
            font-size: 1.1rem;
            margin: 0 0 4px 0;
            font-weight: 500;
        }
        .title-bar p {
            font-size: 0.8rem;
            margin: 0;
            opacity: 0.8;
        }
        /* 右上角房間快速選單（頁籤） */
        .room-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .room-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .room-btn:hover, .room-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }
        /* 下方控制按鈕列（重置視角 + 自動旋轉） */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 空間標題提示 -->
    <div class="title-bar">
        <h2>室內空間環景漫遊</h2>
        <p>點擊熱點切換房間 ｜ 滾輪縮放視角</p>
    </div>

    <!-- 右上角房間快速選擇頁籤 -->
    <div class="room-menu">
        <button class="room-btn active" onclick="switchScene('entrance')">1. 玄關</button>
        <button class="room-btn" onclick="switchScene('livingroom')">2. 客廳</button>
        <button class="room-btn" onclick="switchScene('bedroom')">3. 臥室</button>
    </div>

    <!-- 環景畫面容器 -->
    <div id="panorama"></div>

    <!-- 下方控制按鈕列 -->
    <div class="controls">
        <button class="btn" id="btn-reset">重置目前視角</button>
        <button class="btn" id="btn-auto-rotate">自動旋轉：關</button>
    </div>

    <script>
        // 初始化 Pannellum 環景器
        const viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "entrance",
                "author": "Interior Design",
                "autoLoad": true,
                "hfov": 100 // 預設視角廣度
            },

            "scenes": {
                // 1. 玄關場景 (pano-01.jpg)
                "entrance": {
                    "title": "玄關",
                    "type": "equirectangular",
                    "panorama": "pano-01.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": -180,
                            "type": "scene",
                            "text": "前往客廳",
                            "sceneId": "livingroom"
                        },
                        {
                            "pitch": -5,
                            "yaw": -100,
                            "type": "scene",
                            "text": "前往臥室",
                            "sceneId": "bedroom"
                        }
                    ]
                },

                // 2. 客廳場景 (pano-02.jpg)
                "livingroom": {
                    "title": "客廳",
                    "type": "equirectangular",
                    "panorama": "pano-02.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": 0,
                            "type": "scene",
                            "text": "返回玄關",
                            "sceneId": "entrance"
                        },
                        {
                            "pitch": -5,
                            "yaw": -90,
                            "type": "scene",
                            "text": "前往臥室",
                            "sceneId": "bedroom"
                        }
                    ]
                },

                // 3. 臥室場景 (pano-03.jpg)
                "bedroom": {
                    "title": "臥室",
                    "type": "equirectangular",
                    "panorama": "pano-03.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": 30,
                            "type": "scene",
                            "text": "返回客廳",
                            "sceneId": "livingroom"
                        },
                        {
                            "pitch": -5,
                            "yaw": -55,
                            "type": "scene",
                            "text": "返回玄關",
                            "sceneId": "entrance"
                        }
                    ]
                }
            }
        });

        // 頁籤切換場景函數
        function switchScene(sceneId) {
            viewer.loadScene(sceneId);
        }

        // 監聽場景變換，自動更新右上角頁籤的高亮狀態
        viewer.on('scenechange', function(sceneId) {
            const buttons = document.querySelectorAll('.room-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (sceneId === 'entrance') buttons[0].classList.add('active');
            if (sceneId === 'livingroom') buttons[1].classList.add('active');
            if (sceneId === 'bedroom') buttons[2].classList.add('active');
        });

        // 綁定「重置視角」按鈕功能
        document.getElementById('btn-reset').addEventListener('click', function() {
            viewer.setHfov(100, 1000); 
            viewer.setPitch(0, 1000);  
        });

        // 綁定「自動旋轉」按鈕開關
        let isRotating = false;
        const rotateBtn = document.getElementById('btn-auto-rotate');
        rotateBtn.addEventListener('click', function() {
            isRotating = !isRotating;
            if (isRotating) {
                viewer.startAutoRotate(2); // 設定每秒旋轉 2 度
                rotateBtn.textContent = "自動旋轉：開";
                rotateBtn.style.background = "rgba(255, 255, 255, 0.4)";
            } else {
                viewer.stopAutoRotate();
                rotateBtn.textContent = "自動旋轉：關";
                rotateBtn.style.background = "rgba(255, 255, 255, 0.2)";
            }
        });
    </script>

</body>
</html>
