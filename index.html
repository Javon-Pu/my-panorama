<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° 空間環景漫遊</title>
    <!-- 引入 Pannellum 樣式與核心 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #panorama {
            width: 100%;
            height: 100%;
        }
        /* 左上角標題卡片 */
        .title-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .title-bar h2 {
            font-size: 1.1rem;
            margin: 0 0 4px 0;
            font-weight: 500;
        }
        .title-bar p {
            font-size: 0.8rem;
            margin: 0;
            opacity: 0.8;
        }
        /* 右上角房間快速選擇頁籤 */
        .room-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
            flex-wrap: wrap;
        }
        .room-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .room-btn:hover, .room-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }
        /* 下方控制按鈕列 */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }
        /* 圖片彈跳視窗樣式 (含左右切換箭頭) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 75%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.6);
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 101;
        }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 30px;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.5s;
            z-index: 101;
        }
        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .prev-arrow {
            left: 30px;
        }
        .next-arrow {
            right: 30px;
        }
    </style>
</head>
<body>

    <!-- 空間標題提示 -->
    <div class="title-bar">
        <h2>吳宅_室內室內設計案</h2>
        <p>點擊熱點切換房間 ｜ 滾輪縮放視角</p>
    </div>

    <!-- 右上角房間快速選擇頁籤 -->
    <div class="room-menu">
        <button class="room-btn active" onclick="switchScene('entrance')">1. 玄關</button>
        <button class="room-btn" onclick="switchScene('livingroom')">2. 客廳</button>
        <button class="room-btn" onclick="switchScene('livingroom-back')">3. 客廳後</button>
        <button class="room-btn" onclick="switchScene('bedroom')">4. 臥室</button>
    </div>

    <!-- 環景畫面容器 -->
    <div id="panorama"></div>

    <!-- 下方控制按鈕列 -->
    <div class="controls">
        <button class="btn" id="btn-reset">重置目前視角</button>
        <button class="btn" id="btn-auto-rotate">自動旋轉：關</button>
    </div>

    <!-- 圖片彈跳視窗 (支援多張圖片輪播) -->
    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <button class="nav-arrow prev-arrow" onclick="changeSlide(-1)">&#10094;</button>
        <img class="modal-content" id="modalImg" src="">
        <button class="nav-arrow next-arrow" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <script>
        // 初始化 Pannellum 環景器
        const viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "entrance",
                "author": "Interior Design",
                "autoLoad": true,
                "hfov": 120
            },

            "scenes": {
                // 1. 玄關場景
                "entrance": {
                    "title": "玄關",
                    "type": "equirectangular",
                    "panorama": "pano-01.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": -180,
                            "type": "scene",
                            "text": "前往客廳",
                            "sceneId": "livingroom",
                            "targetYaw": 330,    
                            "targetPitch": 0         
                        },
                        {
                            "pitch": -5,
                            "yaw": -120,
                            "type": "scene",
                            "text": "前往臥室",
                            "sceneId": "bedroom"
                        },
                        {
                            "pitch": -5,
                            "yaw": -45,
                            "type": "scene",
                            "text": "點我開啟門",
                            "sceneId": "opendoor"
                        },
                        {
                            "pitch": -25,
                            "yaw": -90,
                            "type": "info",
                            "text": "查看進門視角 (liv-02)",
                            "clickHandlerFunc": function() {
                                openGallery(['liv-02.jpg']);
                            }
                        }
                    ]
                },

                // 2. 客廳場景
                "livingroom": {
                    "title": "客廳",
                    "type": "equirectangular",
                    "panorama": "pano-02.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": 0,
                            "type": "scene",
                            "text": "返回玄關",
                            "sceneId": "entrance"
                        },
                        {
                            "pitch": -5,
                            "yaw": -90,
                            "type": "scene",
                            "text": "前往客廳後",
                            "sceneId": "livingroom-back"
                        },
                        {
                            "pitch": -5,
                            "yaw": -80,
                            "type": "scene",
                            "text": "前往臥室",
                            "sceneId": "bedroom"
                        },                        
                        {
                            "pitch": 0,
                            "yaw": 45,
                            "type": "info",
                            "text": "查看客廳細節 (liv-01)",
                            "clickHandlerFunc": function() {
                                openGallery(['liv-01.jpg']);
                            }
                        }
                    ]
                },

                // 3. 客廳後場景 (使用您目前客廳或延伸的圖片，此處暫對應 pano-02.jpg，可依需求改為對應的圖檔)
                "livingroom-back": {
                    "title": "客廳後",
                    "type": "equirectangular",
                    "panorama": "pano-05.jpg", 
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": 0,
                            "type": "scene",
                            "text": "返回客廳前",
                            "sceneId": "livingroom"
                        },
                        {
                            "pitch": -5,
                            "yaw": -60,
                            "type": "scene",
                            "text": "返回玄關",
                            "sceneId": "entrance"
                        },                        
                        {
                            "pitch": -5,
                            "yaw": -150,
                            "type": "scene",
                            "text": "前往臥室",
                            "sceneId": "bedroom"
                        }
                    ]
                },

                // 4. 臥室場景
                "bedroom": {
                    "title": "臥室",
                    "type": "equirectangular",
                    "panorama": "pano-03.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": 30,
                            "type": "scene",
                            "text": "返回客廳後",
                            "sceneId": "livingroom-back"
                        },
                        {
                            "pitch": -5,
                            "yaw": -55,
                            "type": "scene",
                            "text": "返回玄關",
                            "sceneId": "entrance"
                        },
                        {
                            "pitch": -5,
                            "yaw": 0,
                            "type": "info",
                            "text": "查看臥室衣櫃細節 (多張)",
                            "clickHandlerFunc": function() {
                                openGallery(['bed-01.jpg', 'bed-02.jpg', 'bed-03.jpg']);
                            }
                        }
                    ]
                },

                // 5. 門開啟視角場景 (無頁籤)
                "opendoor": {
                    "title": "門開啟視角",
                    "type": "equirectangular",
                    "panorama": "pano-04.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5,
                            "yaw": -45,
                            "type": "scene",
                            "text": "返回關門視角",
                            "sceneId": "entrance"
                        }
                    ]
                }
            }
        });

        // 圖片輪播相關變數
        let currentImages = [];
        let currentIndex = 0;

        function openGallery(imgArray) {
            currentImages = imgArray;
            currentIndex = 0;
            const modal = document.getElementById('imageModal');
            modal.style.display = 'flex';
            updateModalImage();
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex >= currentImages.length) {
                currentIndex = 0; 
            } else if (currentIndex < 0) {
                currentIndex = currentImages.length - 1; 
            }
            updateModalImage();
        }

        function updateModalImage() {
            const modalImg = document.getElementById('modalImg');
            modalImg.src = currentImages[currentIndex];
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // 頁籤切換場景函數
        function switchScene(sceneId) {
            viewer.loadScene(sceneId);
        }

        // 監聽場景變換，自動更新右上角頁籤的高亮狀態
        viewer.on('scenechange', function(sceneId) {
            const buttons = document.querySelectorAll('.room-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (sceneId === 'entrance') buttons[0].classList.add('active');
            if (sceneId === 'livingroom') buttons[1].classList.add('active');
            if (sceneId === 'livingroom-back') buttons[2].classList.add('active');
            if (sceneId === 'bedroom') buttons[3].classList.add('active');
        });

        // 綁定「重置視角」按鈕功能
        document.getElementById('btn-reset').addEventListener('click', function() {
            viewer.setHfov(120, 1000); 
            viewer.setPitch(0, 1000);  
        });

        // 綁定「自動旋轉」按鈕開關
        let isRotating = false;
        const rotateBtn = document.getElementById('btn-auto-rotate');
        rotateBtn.addEventListener('click', function() {
            isRotating = !isRotating;
            if (isRotating) {
                viewer.startAutoRotate(2);
                rotateBtn.textContent = "自動旋轉：開";
                rotateBtn.style.background = "rgba(255, 255, 255, 0.4)";
            } else {
                viewer.stopAutoRotate();
                rotateBtn.textContent = "自動旋轉：關";
                rotateBtn.style.background = "rgba(255, 255, 255, 0.2)";
            }
        });
    </script>

</body>
</html>
